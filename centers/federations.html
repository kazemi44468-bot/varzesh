<title>فدراسیون‌های ورزشی ایران | پورتال ورزش</title>
<style>
@font-face{font-family:PortalFa;src:url("../assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:PortalFa;src:url("../assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:PortalFa,Tahoma,sans-serif;color:#193a55;background:linear-gradient(135deg,#fff8e9,#eaf8ff 58%,#f5efff)}
main{width:min(680px,100%);text-align:center;background:#ffffffdf;border:1px solid #fff;border-radius:28px;padding:clamp(28px,6vw,58px);box-shadow:0 22px 65px #31546b18}
.symbol{width:76px;height:76px;margin:0 auto 20px;display:grid;place-items:center;border-radius:24px;background:#fff1d9;color:#e38a37;font-size:38px}
h1{font-size:clamp(25px,5vw,38px);margin:0 0 13px}p{font-size:14px;line-height:2.2;color:#63798b;margin:0 auto 27px;max-width:490px}
a{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:30px;background:#229fbb;color:white;text-decoration:none;font-size:13px;font-weight:700;transition:.2s}
a:hover{background:#187e9a;transform:translateY(-2px)}
</style>
</head>
<body>
<main>
<div class="symbol" aria-hidden="true">🏆</div>
<h1>فدراسیون‌های ورزشی ایران</h1>
<p>این بخش به‌عنوان درگاه جامع معرفی فدراسیون‌ها، رشته‌های ورزشی و ساختار ورزش قهرمانی در حال آماده‌سازی است. در نسخه‌های بعدی، اطلاعات و مسیرهای اختصاصی هر فدراسیون در همین بخش قرار می‌گیرد.</p>
