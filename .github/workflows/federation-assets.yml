name: Download official federation logos and photos
on:
  push:
    branches: [main]
    paths:
      - "data/federations.json"
      - "scripts/download_federation_assets.py"
      - "scripts/collect_federation_sources.py"
      - "centers/federations/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: federation-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image processing dependency
        run: python -m pip install Pillow
      - name: Download federation homepage logos and photographs
        run: python scripts/download_federation_assets.py
      - name: Collect directory logos and official federation content
        run: python scripts/collect_federation_sources.py
      - name: Commit local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/federations data/federations.json centers/federations.html centers/federations
          git diff --cached --quiet || git commit -m "Add downloaded federation logos and photos [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/download_federation_assets.py
              python scripts/collect_federation_sources.py
              git add assets/images/federations data/federations.json centers/federations.html centers/federations
              git diff --cached --quiet || git commit -m "Add downloaded federation logos and photos [skip ci]"
            fi
            sleep 3
          done
          echo "Unable to publish federation assets after three synchronized attempts."
          exit 1
