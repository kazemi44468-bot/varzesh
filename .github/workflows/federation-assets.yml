name: Download official federation logos and photos
on:
  push:
    branches: [main]
    paths:
      - "data/federations.json"
      - "scripts/download_federation_assets.py"
      - "scripts/collect_federation_sources.py"
      - "centers/federations/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: federation-assets-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download federation homepage logos and photographs
        run: python scripts/download_federation_assets.py
      - name: Collect directory logos and official federation content
        run: python scripts/collect_federation_sources.py
      - name: Commit local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/federations data/federations.json centers/federations.html centers/federations
          git diff --cached --quiet || (git commit -m "Add downloaded federation logos and photos [skip ci]" && git pull --rebase origin main && git push)
