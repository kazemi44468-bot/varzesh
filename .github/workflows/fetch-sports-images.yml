name: Download portal sports images
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-sports-images.yml"
      - "index.html"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sports photography
        run: |
          mkdir -p assets/images
          curl -L --fail --silent --show-error "https://images.unsplash.com/photo-1723807566470-f94f30b6ae38?fit=crop&w=2200&q=84&fm=webp" -o assets/images/sports-running-track.webp
          curl -L --fail --silent --show-error "https://images.unsplash.com/photo-1636662978233-bbaf957292c9?fit=crop&w=1400&q=82&fm=webp" -o assets/images/basketball.webp
          curl -L --fail --silent --show-error "https://images.unsplash.com/photo-1758875569517-559a631fb44d?fit=crop&w=1400&q=82&fm=webp" -o assets/images/team-training.webp
          curl -L --fail --silent --show-error "https://images.unsplash.com/photo-1598268030450-7a476f602bf6?fit=crop&w=1400&q=82&fm=webp" -o assets/images/fitness.webp
          curl -L --fail --silent --show-error "https://images.unsplash.com/photo-1727449301677-84ddffa71fb6?fit=crop&w=1400&q=82&fm=webp" -o assets/images/basketball-court.webp
          for f in assets/images/*.webp; do test -s "$f"; done
      - name: Record sources and license
        run: |
          cat > assets/images/README.md <<'EOF'
          # تصاویر پورتال ورزش
          تصاویر از صفحات رایگان Unsplash دریافت شده‌اند. استفاده از آن‌ها تابع Unsplash License است: https://unsplash.com/license
          
          - sports-running-track.webp — https://unsplash.com/photos/a-group-of-people-running-around-a-track-pbaDZJJOepI
          - basketball.webp — https://unsplash.com/photos/a-group-of-young-men-playing-a-game-of-basketball-Y36pAJTt-CY
          - team-training.webp — https://unsplash.com/photos/man-and-woman-exercising-with-battle-ropes-fnLjFrBjHm8
          - fitness.webp — https://unsplash.com/photos/man-in-black-tank-top-and-white-cap-holding-black-and-gray-dumbbell-nR7RzE0OBI0
          - basketball-court.webp — https://unsplash.com/photos/sports-action
          EOF
      - name: Commit images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git diff --cached --quiet || (git commit -m "Add local sports photo assets [skip images]" && git push)
